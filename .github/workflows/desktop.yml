name: Desktop packages

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress
      - name: Build Windows app and installer
        shell: pwsh
        run: .\installer\build-windows.ps1
      - name: Smoke test packaged app (page must load, not "Not Found")
        shell: pwsh
        run: |
          $env:OFFICEMITRA_ROLE = "server"
          $env:OFFICEMITRA_HOME = "$env:RUNNER_TEMP\om-home"
          $proc = Start-Process -FilePath "dist\OfficeMitra\OfficeMitra.exe" -PassThru
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 3
            try {
              $r = Invoke-WebRequest -Uri "http://127.0.0.1:8501/" -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200 -and $r.Content -match "<html") { $ok = $true; break }
            } catch { }
          }
          Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { throw "Packaged OfficeMitra did not serve its page on http://127.0.0.1:8501/" }
          Write-Host "Packaged app served its page."
      - uses: actions/upload-artifact@v4
        with:
          name: OfficeMitra-Windows
          path: |
            dist/OfficeMitra-Setup.exe
            dist/OfficeMitra-windows.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Mac app and DMG
        run: bash installer/macos/build-macos.sh
      - uses: actions/upload-artifact@v4
        with:
          name: OfficeMitra-macOS
          path: dist/OfficeMitra.dmg
          if-no-files-found: error
