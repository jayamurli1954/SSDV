[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ssdv"
version = "0.1.0"
description = "SanMitra Synthetic Data Vault — journal-first ERP data generator"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "PyYAML>=6.0.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "ruff>=0.5"]
ui = ["streamlit>=1.36"]

[project.scripts]
ssdv = "ssdv.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ssdv = ["data/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
